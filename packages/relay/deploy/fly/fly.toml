# From packages/relay: fly launch --config deploy/fly/fly.toml --copy-config --no-deploy && fly secrets set RELAY_TOKENS="niels=<token>" && fly deploy --config deploy/fly/fly.toml
# Guests and hosts then use wss://<app>.fly.dev
app = "pi-multiplayer-relay"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8787"
  RELAY_TRUST_PROXY = "1"

[http_service]
  internal_port = 8787
  force_https = true
  # WebSocket sessions live in memory, so keep exactly one machine running.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 500
    hard_limit = 1000

  [[http_service.checks]]
    grace_period = "5s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "3s"
